<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>{% block title %}{% endblock title %}</title>
	<script src="{{ url_for('static', filename='js/script.js') }}"></script>
	<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" type="text/css" />
	<link rel="icon" sizes="256x256" type="image/ico" href="{{ url_for('static', filename='img/f.ico') }}">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head>
<body>
	<header>
		<nav class="navbar">
			<div class="navbar_div">
				<a href="/" class="navbar name">
					<img src="{{ url_for('static', filename='img/pr.png') }}">
					Alexis
				</a>
				<div>
					<button type="button" class="navbar-button " id="menu_button" onclick="func()">
						<img id="img" title="Меню" src="{{ url_for('static', filename='img/menu.png') }}">
					</button>
				</div>
			</div>
		</nav>
		<div id="menu" style="display: none ;background-color: lightsteelblue;">
			{% block menu %}{% endblock menu %}
		</div>
	</header>
	{% block body %}{% endblock body %}
</body>
</html>
