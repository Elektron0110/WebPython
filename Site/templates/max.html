{% extends "Bases/MainBase.html" %}
{% block title %}MAX{% endblock title %}
{% block body %}
<div class="chat">
</div>
<div class="input-area">
    <textarea id="message-input" placeholder="Введите сообщение..."></textarea>
    <button id="send-button" onclick="sendMessage()">Отправить</button>
</div>
<style>
    :root {
        --radius: 10px;
        --space: 5px;
    }
    .files {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
    }
    .time, .sender {
        font: caption;
    }
    .time {
        font-family: 'AlexisOne';
        font-size: 14px;
    }
    img.file, video.file {
        height: auto;
        width: 90vw;
        border-radius: var(--radius);
    }
    audio.file {
        width: 90vw;
        border-radius: var(--radius);
    }
    div.message {
        margin: var(--space);
        padding: var(--space);
        border: double;
        border-width: var(--space);
        border-radius: var(--radius);
        border-color: var(--nav-button-pressed-border);
        overflow-wrap: anywhere;
        background-color: rgb(220 220 220 / 90%);
        font-family: "Calibri";
    }
    .input-area {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: var(--space);
        background-color: rgb(240 240 240 / 95%);
        display: flex;
        gap: var(--space);
    }
    #message-input {
        flex: 1;
        min-height: 40px;
        max-height: 150px;
        padding: var(--space);
        border-radius: var(--radius);
        border: 1px solid var(--nav-button-pressed-border);
        font-family: "Calibri";
        font-size: 16px;
        resize: vertical;
    }
    #send-button {
        padding: var(--space) 20px;
        border-radius: var(--radius);
        border: none;
        background-color: var(--nav-button-pressed-border);
        color: white;
        font-family: "Calibri";
        font-size: 16px;
        cursor: pointer;
    }
    #send-button:hover {
        opacity: 0.9;
    }
    .chat {
        padding-bottom: 80px;
    }
</style>
<script>
    var messages = [];
    const URI = document.baseURI.split("/");
    const chatId = (URI[URI.length-1] == "max") ? "/0" : "/"+URI[URI.length-1];
    try {
        build();
    } catch (e) {
        alert(e);
    }
    setInterval(build, 60000);

    async function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text) {
            alert('Введите текст сообщения');
            return;
        }

        const button = document.getElementById('send-button');
        button.disabled = true;
        button.textContent = 'Отправка...';

        try {
            const response = await fetch(`/max/send/${chatId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: text })
            });

            const result = await response.json();

            if (response.ok && result.status === 'success') {
                input.value = '';
                // Обновляем сообщения сразу после отправки
                await build();
            } else {
                alert('Ошибка отправки: ' + (result.error || 'Неизвестная ошибка'));
            }
        } catch (e) {
            alert('Ошибка отправки: ' + e);
        } finally {
            button.disabled = false;
            button.textContent = 'Отправить';
        }
    }

    async function build() {
        const res = await fetch(`/max/data${chatId}`);
        const messes = await res.json();
        //const messes = {{ms | safe}}
        const chat = document.getElementsByClassName("chat")[0];
        for (let i = 0; i < messes.length; i++) {
            const last = chat.firstChild;
            const mess = messes[i];
            if (!messages.some(m => JSON.stringify(m) === JSON.stringify(mess)) && (mess["text"] || mess["files"].length > 0)) {
                const message = document.createElement("div");
                message.className = "message";
                const sender = document.createElement("div");
                sender.className = "sender";
                sender.innerHTML = mess["sender"];
                const time = document.createElement("div");
                time.className = "time";
                time.textContent = mess["time"];
                const text = document.createElement("div");
                text.className = "text";
                text.innerHTML = mess["text"].replaceAll("\n", "<br>");
                const files = document.createElement("div")
                files.className = "files";
                for (let j = 0; j < mess["files"].length; j++) {
                    const file_object = mess["files"][j];
                    const file = document.createElement(file_object["type"]);
                    if (file_object["type"] == "a") {
                        file.href = `/static/max/${file_object["file"]}`;
                        file.innerHTML = file_object["file"];
                    } else {
                        file.src = `/static/max/${file_object["file"]}`;
                    }
                    file.className = "file";
                    file.setAttribute("controls", "");
                    files.appendChild(file);
                    //if (j%2==1) {files.appendChild(document.createElement("br"))};
                }
                message.appendChild(time);
                message.appendChild(sender);
                message.appendChild(text);
                if (mess["files"].length > 0) {message.appendChild(files)}
                chat.insertBefore(message, last);
                chat.insertBefore(document.createElement("hr"), last);
                messages.push(mess);
            }
        }
    }

    // Отправка по Ctrl+Enter
    document.getElementById('message-input').addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
{% endblock body %}
