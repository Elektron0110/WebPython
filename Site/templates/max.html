{% extends "Bases/MainBase.html" %}
{% block title %}MAX{% endblock title %}
{% block body %}
<div class="chat">
</div>
<style>
    :root {
        --radius: 10px;
        --space: 5px;
    }
    .files {
        justify-self: center;
    }
    .time, .sender {
        font: caption;
    }
    .time {
        font-family: 'AlexisOne';
        font-size: 14px;
    }
    img.file, video.file {
        height: auto;
        width: 90vw;
        border-radius: var(--radius);
    }
    audio.file {
        width: 90vw;
        border-radius: var(--radius);
    }
    div.message {
        margin: var(--space);
        padding: var(--space);
        border: double;
        border-width: var(--space);
        border-radius: var(--radius);
        border-color: var(--nav-button-pressed-border);
        overflow-wrap: anywhere;
        background-color: rgb(220 220 220 / 90%);
        font-family: "Calibri";
    }
</style>
<script>
    var messages = [];
    try {
        build();
    } catch (e) {
        alert(e);
    }
    setInterval(build, 60000);

    async function build() {
        const URI = document.baseURI.split("/");
        const res = await fetch(`/max/data${(URI[URI.length-1] == "max") ? "/0" : "/"+URI[URI.length-1]}`);
        const messes = await res.json();
        //const messes = {{ms | safe}}
        const chat = document.getElementsByClassName("chat")[0];
        for (let i = 0; i < messes.length; i++) {
            const last = chat.firstChild;
            const mess = messes[i];
            if (!messages.some(m => JSON.stringify(m) === JSON.stringify(mess)) && (mess["text"] || mess["files"].length > 0)) {
                const message = document.createElement("div");
                message.className = "message";
                const sender = document.createElement("div");
                sender.className = "sender";
                sender.innerHTML = mess["sender"];
                const time = document.createElement("div");
                time.className = "time";
                time.textContent = mess["time"];
                const text = document.createElement("div");
                text.className = "text";
                text.innerHTML = mess["text"].replaceAll("\n", "<br>");
                const files = document.createElement("div")
                files.className = "files";
                for (let j = 0; j < mess["files"].length; j++) {
                    const file_object = mess["files"][j];
                    const file = document.createElement(file_object["type"]);
                    if (file_object["type"] == "a") {
                        file.href = `/static/max/${file_object["file"]}`;
                        file.innerHTML = file_object["file"];
                    } else {
                        file.src = `/static/max/${file_object["file"]}`;
                    }
                    file.className = "file";
                    file.setAttribute("controls", "");
                    files.appendChild(file);
                    //if (j%2==1) {files.appendChild(document.createElement("br"))};
                }
                message.appendChild(time);
                message.appendChild(sender);
                message.appendChild(text);
                if (mess["files"].length > 0) {message.appendChild(files)}
                chat.insertBefore(message, last);
                chat.insertBefore(document.createElement("hr"), last);
                messages.push(mess);
            }
        }
    }
</script>
{% endblock body %}
