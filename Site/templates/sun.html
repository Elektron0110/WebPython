{% extends "Bases/FormBase.html" %}
{% block title %}Sun Activity{% endblock title %}
{% block menu %}
	<div style="margin: 20px;">
		<a style="color: chocolate; text-decoration: none;" href="/Ums">УМная погода</a>
		<hr>
		<div style="display: flex;justify-content: space-around;font-size: 25px;font-weight: bold;">
			{% if dt_0 %}
			<a style="color: chocolate; text-decoration: none;" href="/sun?date={{dt_0}}" title="{{dt_0}}">-1 день</a>
			{% endif %}
			{% if dt_1 %}
			<a style="color: chocolate; text-decoration: none;" href="/sun?date={{dt_1}}" title="{{dt_1}}">+1 день</a>
			{% endif %}
			<a style="color: chocolate; text-decoration: none;" href="/sun">Сегодня</a>
		</div>
	</div>
{% endblock menu %}

{% block body %}
	<center><h6>{{loc}}</h6></center>
	<style>
		body {
			background-color: white;
		}
	</style>

	<div>{{ graph | safe }}</div>
{% endblock body %}
