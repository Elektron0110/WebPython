<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Вход</title>
	<link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet" type="text/css" />
	<link rel="icon" sizes="256x256" type="image/ico" href="{{ url_for('static', filename='img/f.ico') }}">
	<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
	<header>
		<nav class="navbar">
			<div class="navbar_div">
				<a href="/" class="navbar name">
					<img src="{{ url_for('static', filename='img/pr.png') }}">
					{{name}}
				</a>
				<div>
					<button type="button" class="navbar-button " id="menu_button" onclick="func()">
						<img id="img" title="Меню" src="{{ url_for('static', filename='img/menu.png') }}">
					</button>
				</div>
			</div>
		</nav>
	</header>
	<div class="form">
		<form method="post" action="/lk">
			<div style="display: grid; justify-content: center;">
				<input required type="email" name="email" class="in" value="{{email}}" placeholder="Электронная почта">
				<br>
				<input required type="password" name="password" class="in" value="{{password}}" placeholder="Пароль">
				<input name="thing" value="login" style="display: none">
				<br>
			</div>
			<center>
				<input type="submit" value="Вход/Регистрация" class="in submit">
			</center>
		</form>
	</div>
</body>
</html>
