{% extends "Bases/BaseBase.html" %}
{% block title %}{{name}}{% endblock title %}
{% block body %}
    <center style="color:gainsboro">
        <h1>{{name}}.</h1>
        {% for p in let %}
        <p>
            {% for br in p %}
            {% if "<" not in br and ">" not in br %}
            <br>
            {{br}}
            {% endif %}
            {% endfor %}
        </p>
        {% endfor %}
    </center>
    <p></p>
{% endblock body %}
