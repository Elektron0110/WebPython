<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Сообщения</title>
	<script src="{{ url_for('static', filename='js/script.js') }}"></script>
	<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" type="text/css" />
	<link href="{{ url_for('static', filename='css/Mstyle.css') }}" rel="stylesheet" type="text/css" />
	<link rel="icon" sizes="256x256" type="image/ico" href="{{ url_for('static', filename='img/f.ico') }}">
</head>
<body>
	<header>
		<nav class="navbar">
			<div class="navbar_div">
				<a href="/" class="navbar name">
					<img src="{{ url_for('static', filename='img/pr.png') }}">
					{{name}}
				</a>
				<div>
					<button type="button" class="navbar-button " id="menu_button" onclick="func()">
						{{session['user'].split(' ')[0]}}
						{{session['user'].split(' ')[1]}}
						{{session['user'].split(' ')[2]}}
					</button>
				</div>
			</div>
		</nav>
		<div id="menu" style="display: none; background-color: lightsteelblue;">
			<ul>
				<li><a href="/logout">Выход</a></li>
			</ul>
		</div>
	</header>
	<div style="margin: 5;">
		{% for mm in messes %}
		<a href="/mess/{{mm[0]}}" class="ml">
			<div class="message">
				<div class="sender" flex="1"><center>{{mm[1]}}</center></div>
				<div class="topic" flex="1"><center>{{mm[2]}}</center></div>
				<div class="text" flex="1"><center>{{mm[3]}}</center></div>
				<div class="date" flex="1"><center>{{mm[4]}}</center></div>
			</div>
		</a>
		<p></p>
		{% endfor %}
	</div>
	<script>
		function func () {
			var menu = document.getElementById("menu");
			var menu_button = document.getElementById("menu_button");
			see_user(menu_button, menu);
		}
	</script>
</body>
</html>
