<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Заявка на обработку чего-либо</title>
	<link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet" type="text/css" />
	<link rel="icon" sizes="256x256" type="image/ico" href="{{ url_for('static', filename='img/f.ico') }}">
	<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
	<header>
		<nav class="navbar">
			<div class="navbar_div">
				<a href="/" class="navbar name">
					<img src="{{ url_for('static', filename='img/pr.png') }}">
					{{name}}
				</a>
				<div>
					<button type="button" class="navbar-button " id="menu_button" onclick="func()">
						{{session['user'].split(' ')[0]}}
						{{session['user'].split(' ')[1]}}
						{{session['user'].split(' ')[2]}}
					</button>
				</div>
			</div>
		</nav>
	</header>
	<div class="form">
		<form method="post" action="/new">
			<div style="display: grid; justify-content: center;">
				<label class="in">Проверьте правильность введённых данных. <a href="/update">Изменить</a></label>
				<br>
				<input readonly type="text" name="s" class="in" placeholder="Фамилия" value="{{session['user'].split(' ')[0]}}">
				<br>
				<input readonly type="text" name="f" class="in" placeholder="Имя" value="{{session['user'].split(' ')[1]}}">
				<br>
				<input readonly type="text" name="t" class="in" placeholder="Отчество" value="{{session['user'].split(' ')[2]}}">
				<br>
				{% if session['telephone'] != '' %}
				<input readonly type="tel" name="tel" class="in" placeholder="+7 (___) ___-__-__" maxlength="18" id="tel" value="{{session['telephone']}}">
				{% else %}
				<input required type="tel" name="tel" class="in" placeholder="+7 (___) ___-__-__" maxlength="18" id="tel">
				{% endif %}
				<br>
				<label>
					Ваш день рождения.
					{% if session['birthday'] != '' %}
					<input readonly type="date" name="b_day" class="in" max="{{date}}" value="{{session['birthday']}}">
					{% else %}
					<input required type="date" name="b_day" class="in" max="{{date}}">
					{% endif %}
				</label>
				<input hidden type="text" name="type" value="check">
				<br>
			</div>
			<center>
				<input type="submit" value="Всё верно." class="in submit">
			</center>
		</form>
	</div>
	<script src="{{ url_for('static', filename='reg.js') }}"></script>
</body>
</html>
