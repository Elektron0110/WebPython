<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Заявка на обработку чего-либо</title>
	<link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet" type="text/css" />
	<link rel="icon" sizes="256x256" type="image/ico" href="{{ url_for('static', filename='img/f.ico') }}">
	<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
	<header>
		<nav class="navbar">
			<div class="navbar_div">
				<a href="/" class="navbar name">
					<img src="{{ url_for('static', filename='img/pr.png') }}">
					{{name}}
				</a>
				<div>
					<button type="button" class="navbar-button " id="menu_button" onclick="func()">
						{{session['user'].split(' ')[0]}}
						{{session['user'].split(' ')[1]}}
						{{session['user'].split(' ')[2]}}
					</button>
				</div>
			</div>
		</nav>
	</header>
	<div class="form">
		<form method="post" action="/new" enctype="multipart/form-data">
			<div style=" display: grid; justify-content: center;">
				<input readonly type="text" name="s" class="in" placeholder="Фамилия" value="{{session['user'].split(' ')[0]}}">
				<br>
				<input readonly type="text" name="f" class="in" placeholder="Имя" value="{{session['user'].split(' ')[1]}}">
				<br>
				<input readonly type="text" name="t" class="in" placeholder="Отчество" value="{{session['user'].split(' ')[2]}}">
				<br>
				<input readonly type="tel" name="tel" class="in" placeholder="+7 (___) ___-__-__" maxlength="18" value="{{session['telephone']}}">
				<br>
				<label>
					Ваш день рождения.
					<input readonly type="date" name="b_day" class="in" max="{{date}}" value="{{session['birthday']}}">
				</label>
				<br>
				<input required type="text" name="way" class="in" placeholder="Сайт для поиска">
				<br>
 				<input required type="file" class="in" id="fileInput" name="fileInput" accept=".txt">
 				<input required hidden name="lines" id="span">
				<input hidden type="text" name="type" value="input">
				<br>
			</div>
			<center>
				<input type="submit" value="Отправить" class="in submit" id="submit">
			</center>
		</form>
	</div>
	<script src="{{ url_for('static', filename='js/get_file.js') }}"></script>
</body>
</html>
