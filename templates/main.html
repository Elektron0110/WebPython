<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>{{name}}</title>
	<script src="{{ url_for('static', filename='script.js') }}"></script>
	<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" type="text/css" />
	<link rel="icon" sizes="256x256" type="image/ico" href="{{ url_for('static', filename='f.ico') }}">
</head>
<body>
	<header>
		<nav class="navbar">
			<div class="navbar_div">
				<a href="/" class="navbar name">
					<img src="{{ url_for('static', filename='pr.png') }}">
					{{name}}
				</a>
				<div>
					<button type="button" class="navbar-button " id="menu_button" onclick="func()">
						<img id="img" title="Меню" src="{{ url_for('static', filename='menu.png') }}">
					</button>
				</div>
			</div>
		</nav>
		<div id="menu" style="display: none ;background-color: lightsteelblue;">
			<ul>
				<li><a href="/lk">{{prompt}}</a></li>
			</ul>
		</div>
	</header>
	<script>
		function func () {
			var menu = document.getElementById("menu");
			var menu_button = document.getElementById("menu_button");
			var img = document.getElementById("img");
			see_menu(menu_button, menu, img);
		}
	</script>
</body>
</html>
