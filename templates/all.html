<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title></title>
	<link href="{{ url_for('static/css', filename='login.css') }}" rel="stylesheet" type="text/css" />
	<link href="{{ url_for('static/css', filename='style.css') }}" rel="stylesheet" type="text/css" />
	<link rel="icon" sizes="256x256" type="image/ico" href="{{ url_for('static/img', filename='f.ico') }}">
</head>
<body>
	<nav class="navbar">
		<div class="navbar_div">
			<a href="/" class="navbar name">
				<img src="{{ url_for('static/img', filename='pr.png') }}">
				{{name}}
			</a>
			<div>
				<button type="button" class="navbar-button " id="menu_button" onclick="func()">
					{{session['user'].split(' ')[0]}}
					{{session['user'].split(' ')[1]}}
					{{session['user'].split(' ')[2]}}
				</button>
			</div>
		</div>
	</nav>
	<div class="form">
		<form method="post" action="/update">
			<div style=" display: grid; justify-content: center;">
				<input required type="text" name="s" class="in" placeholder="Фамилия" value="{{session['user'].split(' ')[0]}}">
				<br>
				<input required type="text" name="f" class="in" placeholder="Имя" value="{{session['user'].split(' ')[1]}}">
				<br>
				<input required type="text" name="t" class="in" placeholder="Отчество" value="{{session['user'].split(' ')[2]}}">
				<br>
				<input required type="tel" name="tel" class="in" placeholder="+7 (___) ___-__-__" id="tel" maxlength="18" value="{{tel}}">
				<br>
				<label>
					Ваш день рождения.
					<input required type="date" name="b_day" class="in" max="{{date}}" value="{{birthday}}">
				</label>
				<input name="thing" value="register" style="display: none">
				<br>
			</div>
			<center>
				<input type="submit" value="Обновить" class="in submit">
			</center>
		</form>
		<a href="/lk" class="in submit">Назад</a>
	</div>
	<script src="{{ url_for('static/js', filename='reg.js') }}"></script>
</body>
</html>
