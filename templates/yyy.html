<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
		<title>Придумать</title>
		<link href="{{ url_for('static', filename='login.css') }}" rel="stylesheet" type="text/css" />
		<link rel="icon" sizes="256x256" type="image/ico" href="{{ url_for('static', filename='f.ico') }}">
	</head>
	<body>
		<div class="form">
			<form method="post" action="/new">
				<div style=" display: grid; justify-content: center;">
					<input readonly type="text" name="s" class="in" placeholder="Фамилия" value="{{session['user'].split(' ')[0]}}">
					<br>
					<input readonly type="text" name="f" class="in" placeholder="Имя" value="{{session['user'].split(' ')[1]}}">
					<br>
					<input readonly type="text" name="t" class="in" placeholder="Отчество" value="{{session['user'].split(' ')[2]}}">
					<br>
					<input readonly type="tel" name="tel" class="in" placeholder="+7 (___) ___-__-__" maxlength="18" value="{{session['telephone']}}">
					<br>
					<label>
						Ваш день рождения.
						<input readonly type="date" name="b_day" class="in" max="{{date}}" value="{{session['birthday']}}">
					</label>
					<br>
					<select required name="way" class="in" id="select">
						<option value=""> --- Тип поиска --- </option>
        				<option value="Имя">Имя Город === 15₽/компания.</option>
        				<option value="Инн">Инн	======== 10₽/компания.</option>
        				<option value="Нквд">ОКВЭД-2 ==== 0,1₽/компания.</option>
    				</select>
					<br>
 					<input required type="file" class="in" id="fileInput" accept=".txt">
 					<input required hidden name="lines" id="span">
 					<input required hidden name="text" id="text">
					<input hidden type="text" name="type" value="input">
					<br>
				</div>
				<center>
					<input type="submit" value="Отправить" class="in submit" id="submit">
				</center>
			</form>
		</div>
		<script src="{{ url_for('static', filename='get_file.js') }}"></script>
	</body>
</html>
